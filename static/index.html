<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArchiEvidence 知识检索实验室</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><span class="logo">AE</span><span>ARCHI EVIDENCE<br><small>知识检索实验室</small></span><span class="mode">本地检索演示</span></header>
<section class="intro"><span class="eyebrow">READ · RETRIEVE · VERIFY</span><h1>每个回答，都能找到出处。</h1><p>把学习笔记变成可检索的知识库。先查看证据，再形成判断。</p></section>
<div class="grid"><section class="card"><div class="label">01 / 提出问题</div><h2>从一个具体问题开始</h2><form id="form"><label for="question">你想了解什么？</label><textarea id="question" required maxlength="2000" placeholder="例如：RAG 的流程是什么？"></textarea><div class="samples"><button type="button" data-q="RAG 的流程是什么？">RAG 流程</button><button type="button" data-q="Agent Loop 如何终止？">Agent 工具调用</button><button type="button" data-q="自然通风路径包括什么？">自然通风</button></div><button class="submit" id="submit">检索笔记 →</button></form><div class="status" id="status">正在连接知识库…</div><p class="note">当前网页使用 BM25 检索并展示摘录。在线模型工具调用可通过 CLI 启用。</p></section>
<section class="card result" aria-live="polite"><div class="label">02 / 核对证据</div><h2 id="result-title">结果会显示在这里</h2><p id="empty">每个片段保留文件名与行号，方便回到原文验证。</p><div id="sources"></div><p class="note" id="notice">样例内容为原创教学笔记，不构成建筑设计规范。</p></section></div><footer>Python / SQLite FTS5 / FastAPI <span>可复现 · 可检查 · 可扩展</span></footer></main></body></html>
